services:
  goynote:
    build: .
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__GoynoteDB=Data Source=/app/data/goynote.db
      - ASPNETCORE_ENVIRONMENT=Production
      - AWS__Region=eu-central-1
      - AWS__BucketName=${AWS_BUCKET_NAME}
      - AWS__AccessKey=${AWS_ACCESS_KEY}
      - AWS__SecretKey=${AWS_SECRET_KEY}
    volumes:
      - goynote-data:/app/data
    restart: unless-stopped

volumes:
  goynote-data:
